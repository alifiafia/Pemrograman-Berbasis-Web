<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sederhana</title>
    <link rel="stylesheet" href="kalkulator.css">
</head>
<body>
    <div class="calculator">
        <h2>Kalkulator Sederhana</h2>
        <h3>by: Alifia Nur Huda</h3>
    
        <label for="angka1">Angka 1:</label>
        <input type="number" id="angka1" placeholder="Masukkan angka pertama">
    
        <label for="angka2">Angka 2:</label>
        <input type="number" id="angka2" placeholder="Masukkan angka kedua">
    
        <label for="operator">Pilih Operasi:</label>
        <select id="operator">
            <option value="+">Tambah (+)</option>
            <option value="-">Kurang (-)</option>
            <option value="*">Kali (*)</option>
            <option value="/">Bagi (/)</option>
            <option value="%">Modulus (%)</option>
        </select>
    
        <button id="calculator">Hitung</button>
        <p id="result">Hasil Operasi: </p>
    </div>
    
    <script src="kalkulator.js"></script>
</body>
</html>
